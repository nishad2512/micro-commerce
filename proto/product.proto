syntax = "proto3";

package product;

service ProductService {
    rpc CreateProduct (dto) returns (Product);
}

message dto {
    string title = 1;
    string description = 2;
    int32 quantity = 3;
    float price = 4;
}

message Product {
    string productId = 1;
    string title = 2;
    string description = 3;
    int32 quantity = 4;
    float price = 5;
}