syntax = "proto3";

package product;

service ProductService {
    rpc CreateProduct (dto) returns (Product);
    rpc GetProduct (GetProductRequest) returns (Product);
    rpc ListProducts (ListProductsRequest) returns (ProductList);
}

message GetProductRequest { int32 productId = 1; }
message ListProductsRequest { int32 page = 1; int32 limit = 2; }
message ProductList { repeated Product products = 1; int32 total = 2; }

message dto {
    string title = 1;
    string description = 2;
    int32 quantity = 3;
    float price = 4;
}

message Product {
    string productId = 1;
    string title = 2;
    string description = 3;
    int32 quantity = 4;
    float price = 5;
}
