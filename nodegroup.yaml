apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: my-microservices-cluster
  region: us-east-1

managedNodeGroups:
  - name: free-workers-small
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 4
    # This forces EKS to explicitly provision them into the public subnets
    privateNetworking: false 
